name: Publish daily curiosity
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '10,30 0 * * *'
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sync
        env:
          SOURCE_SITE_TOKEN: ${{ secrets.SOURCE_SITE_TOKEN }}
          REQUIRE_SYNC: ${{ github.event_name == 'schedule' }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
